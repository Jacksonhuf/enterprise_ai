name: F-G validation
on: [push, pull_request]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/platform/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import-source.py
      - run: python -m pip install jsonschema==4.26.0
      - run: COGNARA_CONTRACT_CAPTURE=/tmp/cognara-contract.jsonl go test -C backend/platform -race -count=1 ./internal/platform/... ./cmd/cognara-dev
      - run: python scripts/validate-contract-capture.py /tmp/cognara-contract.jsonl
      - run: npm ci && npx vue-tsc --noEmit -p tsconfig.cognara.json && npm run build
        working-directory: frontend
