name: F-G validation
on: [push, pull_request]
jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: validation-only-mysql-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: cognara_validation
        ports:
          - '127.0.0.1:3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cognara_test
          POSTGRES_PASSWORD: validation-only-password
          POSTGRES_DB: cognara_validation
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U cognara_test -d cognara_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COGNARA_TEST_MYSQL_DSN: root:validation-only-mysql-password@tcp(127.0.0.1:3306)/cognara_validation
      COGNARA_MYSQL_DSN: root:validation-only-mysql-password@tcp(127.0.0.1:3306)/cognara_validation
      COGNARA_REQUIRE_MYSQL_TESTS: '1'
      COGNARA_TEST_APPLICATION_PLAN_BINARY: /tmp/cognara-migrate-applications
      COGNARA_TEST_GRANT_PLAN_BINARY: /tmp/cognara-migrate-grants
      COGNARA_TEST_SESSION_PLAN_BINARY: /tmp/cognara-migrate-sessions
      COGNARA_TEST_SETTINGS_PLAN_BINARY: /tmp/cognara-migrate-settings
      COGNARA_TEST_EXCEPTION_PLAN_BINARY: /tmp/cognara-migrate-exceptions
      COGNARA_TEST_USAGE_PLAN_BINARY: /tmp/cognara-migrate-usage
      COGNARA_TEST_MIGRATE_BINARY: /tmp/cognara-migrate-audit
      COGNARA_TEST_IMPORT_BINARY: /tmp/cognara-state-import
      COGNARA_TEST_RUNTIME_BINARY: /tmp/cognara-dev
      COGNARA_TEST_EXPORT_BINARY: /tmp/cognara-state-export
      COGNARA_TEST_POSTGRES_DSN: postgres://cognara_test:validation-only-password@127.0.0.1:5432/cognara_validation?sslmode=disable
      COGNARA_POSTGRES_DSN: postgres://cognara_test:validation-only-password@127.0.0.1:5432/cognara_validation?sslmode=disable
      COGNARA_REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/platform/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import-source.py
      - run: python -m pip install 'jsonschema[format-nongpl]==4.26.0'
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-migrate-applications ./cmd/cognara-migrate-applications
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-migrate-grants ./cmd/cognara-migrate-grants
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-migrate-sessions ./cmd/cognara-migrate-sessions
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-migrate-settings ./cmd/cognara-migrate-settings
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-migrate-exceptions ./cmd/cognara-migrate-exceptions
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-migrate-usage ./cmd/cognara-migrate-usage
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-migrate-audit ./cmd/cognara-migrate-audit
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-state-import ./cmd/cognara-state-import
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-dev ./cmd/cognara-dev
      - run: go build -C backend/platform -tags=nomsgpack -o /tmp/cognara-state-export ./cmd/cognara-state-export
      - name: Platform Go tests
        run: |
          COGNARA_CONTRACT_CAPTURE=/tmp/cognara-contract.jsonl go test -C backend/platform -tags=nomsgpack -p 1 -race -count=1 \
            ./internal/platform/... ./cmd/cognara-dev ./cmd/cognara-state-export ./cmd/cognara-state-import ./cmd/cognara-migrate-audit \
            ./cmd/cognara-migrate-applications ./cmd/cognara-migrate-grants ./cmd/cognara-migrate-sessions ./cmd/cognara-migrate-settings \
            ./cmd/cognara-migrate-exceptions ./cmd/cognara-migrate-usage 2>&1 | tee /tmp/platform-go-test.log
      - name: Runbook smoke summary artifact
        if: always()
        run: python scripts/collect-runbook-smoke-summary.py /tmp/platform-go-test.log /tmp/runbook-smoke-summary.json
      - name: Upload R21 staging alert render
        uses: actions/upload-artifact@v4
        with:
          name: r21-staging-alert-render
          path: /tmp/r21-staging-alerts.prom.txt
      - name: Upload runbook smoke summary from validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runbook-smoke-summary-validation
          path: /tmp/runbook-smoke-summary.json
      - run: python scripts/validate-rehearsal-log-record.py docs/development/fixtures/schema8-rehearsal-log-example.json
      - run: python scripts/validate-r21-alerting-dry-run.py docs/development/fixtures/r21-alerting-dry-run.rules.json
      - run: python scripts/render-r21-alerting-staging-prometheus.py docs/development/fixtures/r21-alerting-dry-run.rules.json /tmp/r21-staging-alerts.prom.txt
      - run: python scripts/validate-r21-staging-alert-render.py /tmp/r21-staging-alerts.prom.txt
      - run: python scripts/validate-staging-import-ticket.py docs/development/fixtures/staging-alert-import-ticket-example.json
      - run: python scripts/validate-staging-import-ticket.py docs/development/fixtures/staging-alert-import-ticket-closed-shape-example.json
      - run: python scripts/validate-r21-slo-signoff-record.py docs/development/fixtures/r21-slo-signoff-record-pending.json
      - run: bash scripts/r09-ready-probe-harness.sh
      - name: R09 tier probes and summary
        run: bash scripts/r09-tier-probes-and-summary.sh /tmp/r09-tier-probe.log /tmp/r09-tier-probe-summary.json
      - name: Upload R09 tier probe summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r09-tier-probe-summary
          path: /tmp/r09-tier-probe-summary.json
      - run: python scripts/validate-tier-probe-summary.py /tmp/r09-tier-probe-summary.json
      - run: python scripts/validate-tier-probe-summary.py docs/development/fixtures/r09-tier-probe-summary-shape-example.json
      - run: python scripts/validate-engineering-pilot-bundle.py docs/development/fixtures/engineering-pilot-bundle-pending-example.json
      - run: python scripts/validate-r21-slo-signoff-record.py docs/development/fixtures/r21-slo-signoff-record-signed-shape-example.json
      - run: python scripts/validate-r21-metrics-wiring-draft.py docs/development/fixtures/r21-metrics-wiring-draft.json
      - run: python scripts/validate-production-ledger.py docs/development/fixtures/schema8-production-ledger-pending-example.json
      - run: python scripts/validate-production-ledger.py docs/development/fixtures/schema8-production-ledger-entered-shape-example.json
      - run: pip install pyyaml==6.0.2
      - run: python scripts/validate-r21-recording-rules-draft.py docs/development/fixtures/r21-recording-rules-draft.yaml
      - run: python scripts/validate-openmetrics-exporter-draft.py docs/development/fixtures/openmetrics-exporter-draft.txt
      - run: python scripts/validate-rehearsal-log-record.py docs/development/fixtures/schema8-production-log-shape-example.json
      - run: python scripts/validate-contract-capture.py /tmp/cognara-contract.jsonl
      - run: python scripts/verify-runtime.py --binary /tmp/cognara-dev --storage json
      - run: python scripts/verify-runtime.py --binary /tmp/cognara-dev --storage sqlite
      - run: python scripts/verify-runtime.py --binary /tmp/cognara-dev --storage postgres
      - run: python scripts/verify-runtime.py --binary /tmp/cognara-dev --storage mysql
      - run: python scripts/verify-mysql-export.py --binary /tmp/cognara-state-export
      - run: npm ci && npm run test:cognara && npx vue-tsc --noEmit -p tsconfig.cognara.json && npm run build
        working-directory: frontend
      - run: npm run check:cognara-bundle
        working-directory: frontend
      - name: Browser smoke on production build
        run: |
          npm install --no-save playwright-core@1.62.1
          mkdir -p /tmp/r18-spots
          CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)" COGNARA_SMOKE_BINARY=/tmp/cognara-dev COGNARA_R18_CAPTURE=/tmp/r18-spots npm run test:cognara-browser
        working-directory: frontend
      - name: R18 pixel baseline gate
        run: |
          npm install --no-save pixelmatch pngjs
          node scripts-verify-r18-baseline.mjs /tmp/r18-spots
        working-directory: frontend
      - name: Upload R18 spot screenshot baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-spot-screenshots
          path: /tmp/r18-spots/
